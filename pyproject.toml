[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyparse"
version = "0.1.0"
description = "Small dependency-free text parsing helpers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "meduuv"}]

[tool.setuptools.packages.find]
where = ["src"]
